# gitleaks を落とし、照合の値（SHA-256）で確かめて置く。
# ci.yml と security-weekly.yml の両方が使う。版は scripts/security/secrets.ts の MIN_GITLEAKS_VERSION と同じにする
# （tests/security/ci-config.test.ts が確かめる）。使う前に actions/checkout が要る。
name: setup-gitleaks
description: gitleaks（固定の版）を落とし、照合の値で確かめて /usr/local/bin に置く
runs:
  using: composite
  steps:
    - name: gitleaks を入れる（照合の値で確かめる）
      shell: bash
      env:
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      run: |
        cd "$RUNNER_TEMP"
        curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz gitleaks
        sudo install gitleaks /usr/local/bin/gitleaks
        rm gitleaks gitleaks.tar.gz
