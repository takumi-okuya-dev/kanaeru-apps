# 1つの環境へのデプロイ（core-002・core-018・core-019）。deploy.yml が、ステージング（staging）と本番（production）で呼ぶ。
# 順番：変数の確かめ → コンテナを作ってその環境の置き場所へ → 同じコンテナで db:migrate（Cloud Run jobs）→ 成功したときだけ新しい版を出す → 動いているかの確かめ。
# どの環境かは GitHub の環境（environment）で決め、その環境の変数を使う。本番（production）は GitHub の環境の承認者が承認するまで始まらない
# （Settings → Environments → production の Required reviewers。infra/README.md の 5）。
# GCP へは Workload Identity Federation で入り、その環境のデプロイ用のサービスアカウントになりすます（鍵は置かない）。
# 秘密の値（secrets.*）は使わない。使うのは変数（vars.*）だけ：
# - リポジトリの変数：GCP_PROJECT_ID・GCP_REGION・GCP_WIF_PROVIDER（terraform output github_repository_variables）
# - 環境の変数（production・staging）：GCP_DEPLOYER_SA・CLOUD_RUN_SERVICE・MIGRATE_JOB・IMAGE_REPOSITORY・APP_NAME（terraform output の各環境の github_environment_variables）と LIFF_ID（LINE の側）
# イメージは環境ごとの置き場所に押し込み、Cloud Run には digest（中身の指紋）で渡す（押し込んだあとにタグを付け替えられても、確かめた中身だけを出す）。
# 外の部品はコミットの指紋（SHA）で固定し、版の名前を注釈に書く（Dependabot が新しくする）。
name: deploy-environment

on:
  workflow_call:
    inputs:
      environment:
        description: "出す先の GitHub の環境（staging・production）"
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    # 1つの環境へのデプロイは1つずつ（main と develop の流れが同じ環境に同時に出して、DB の変更がぶつからないように）
    concurrency:
      group: deploy-environment-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      LIFF_ID: ${{ vars.LIFF_ID }}
      # 画面の題に埋める名前。Terraform の app_name（Cloud Run の APP_NAME）と同じにする（infra/README.md 5）。入れ忘れたら止める（既定の値を持たない）
      APP_NAME: ${{ vars.APP_NAME }}
      # 環境ごとの置き場所（押し込めるのはその環境のデプロイの身分だけ。LIFF ID と APP_NAME を組み立てに埋めるので、中身も環境で違う）
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
      IMAGE: ${{ vars.IMAGE_REPOSITORY }}:${{ github.sha }}
    steps:
      - name: 変数の確かめ
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          # 空白だけの値も「ない」とみなす。とくに LIFF_ID が空だと、画面は LINE につながない仮の LIFF の形で組み立てられ、黙って出てしまう
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA SERVICE MIGRATE_JOB IMAGE_REPOSITORY LIFF_ID APP_NAME; do
            if [ -z "$(printenv "$name" | tr -d '[:space:]')" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::変数がありません：${missing}（${DEPLOY_ENV}。GCP_PROJECT_ID・GCP_REGION・GCP_WIF_PROVIDER はリポジトリの変数、ほかは Settings → Environments → ${DEPLOY_ENV} の変数に入れる。SERVICE は CLOUD_RUN_SERVICE。値は infra/ の terraform output と LINE の LIFF ID。infra/README.md の 5）"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: コンテナを作って Artifact Registry へ押し込む
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --build-arg VITE_LIFF_ID="$LIFF_ID" --build-arg APP_NAME="$APP_NAME" --tag "$IMAGE" .
          docker push "$IMAGE"
          # ここから先は digest（中身の指紋）で指す。タグはあとから付け替えられるため（押し込んだあとの docker が持つ値を使う）
          image_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          case "$image_digest" in
            "${IMAGE_REPOSITORY}@sha256:"*) ;;
            *) echo "::error::押し込んだイメージの digest を読めませんでした：${IMAGE}"; exit 1 ;;
          esac
          echo "IMAGE_DIGEST=${image_digest}" >> "$GITHUB_ENV"

      # 同じコンテナで DB の変更を当てる。失敗したら、ここで止まり、新しい版は出ない（AD-11）
      - name: DB の変更を当てる（Cloud Run jobs の db:migrate）
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image="$IMAGE_DIGEST" --region="$GCP_REGION" --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --region="$GCP_REGION" --wait

      - name: 新しい版を出す（Cloud Run）
        run: |
          gcloud run services update "$SERVICE" --image="$IMAGE_DIGEST" --region="$GCP_REGION" --quiet

      - name: 動いているかの確かめ
        run: |
          url=$(gcloud run services describe "$SERVICE" --region="$GCP_REGION" --format='value(status.url)')
          # 新しい台は Direct VPC egress で DB につながるまで1分以上かかることがある（Google の文書）。4分まで待つ
          curl --fail --silent --show-error --max-time 15 --retry 20 --retry-delay 10 --retry-max-time 240 --retry-all-errors "${url}/api/v1/health"
          echo
          echo "${DEPLOY_ENV} に出しました：${url}"
