# 本番へのデプロイ（core-002。docs/rules/development-flow.md 5・構成の決めごと AD-11）。
# 流れる時：main に push したとき（出すものが変わるファイルだけ。文書・仕様・infra/ だけの変更では流れない）と、main から手で流したとき。
# 順番：時間帯の確かめ → コンテナを作って Artifact Registry へ → 同じコンテナで db:migrate（Cloud Run jobs）→ 成功したときだけ新しい版を出す。
# GCP へは Workload Identity Federation で入り、デプロイ用のサービスアカウントになりすます（鍵は置かない。Cloud Run は WIF の直の権限に対応していない）。
# 秘密の値（secrets.*）は使わない。使うのはリポジトリの変数（vars.*）だけ：GCP_PROJECT_ID・GCP_REGION・GCP_WIF_PROVIDER・GCP_DEPLOYER_SA・LIFF_ID。
# 外の部品はコミットの指紋（SHA）で固定し、版の名前を注釈に書く（Dependabot が新しくする）。
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      skip_hour_check:
        description: "時間帯の確かめ（8時〜24時）を飛ばす。夜間の停止を止めて DB が動いていると確かめたときだけ"
        type: boolean
        default: false

# デプロイは1つずつ。DB の変更の途中で止めないよう、流れているものは取り消さず、後のものを待たせる
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: kanaeru
      MIGRATE_JOB: kanaeru-migrate
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      LIFF_ID: ${{ vars.LIFF_ID }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/kanaeru/app:${{ github.sha }}
    steps:
      # DB は夜間（0時〜8時。日本時間）に止まっているので、その間は db:migrate が落ちる（AD-10）。GitHub Actions は時刻で止められないので、ここで早く落とす
      - name: 時間帯の確かめ（日本時間の8時〜24時だけ出す）
        if: ${{ !inputs.skip_hour_check }}
        run: |
          hour=$(TZ=Asia/Tokyo date +%-H)
          if [ "$hour" -lt 8 ]; then
            echo "::error::日本時間の ${hour} 時です。DB は夜間（0時〜8時）止まっているので、デプロイしません。8時を過ぎてから、Actions の deploy を main で手で流してください（Run workflow）。交流会で夜間の停止を止めていて DB が動いているときだけ、skip_hour_check を入にして流せます。"
            exit 1
          fi
          echo "日本時間の ${hour} 時です。デプロイします。"

      - name: リポジトリの変数の確かめ
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA LIFF_ID; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::リポジトリの変数（Settings → Secrets and variables → Actions → Variables）がありません：${missing}（値は infra/ の terraform output github_variables と LINE の LIFF ID。infra/README.md の 5）"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: コンテナを作って Artifact Registry へ押し込む
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --build-arg VITE_LIFF_ID="$LIFF_ID" --tag "$IMAGE" .
          docker push "$IMAGE"

      # 同じコンテナで DB の変更を当てる。失敗したら、ここで止まり、新しい版は出ない（AD-11）
      - name: DB の変更を当てる（Cloud Run jobs の db:migrate）
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image="$IMAGE" --region="$GCP_REGION" --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --region="$GCP_REGION" --wait

      - name: 新しい版を出す（Cloud Run）
        run: |
          gcloud run services update "$SERVICE" --image="$IMAGE" --region="$GCP_REGION" --quiet

      - name: 動いているかの確かめ
        run: |
          url=$(gcloud run services describe "$SERVICE" --region="$GCP_REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${url}/api/v1/health"
          echo
          echo "出しました：${url}"
