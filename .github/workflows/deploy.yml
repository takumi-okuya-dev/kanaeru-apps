# 本番とステージングへのデプロイ（core-002・core-018・core-019。docs/rules/development-flow.md 5・構成の決めごと AD-11）。
# 流れる時：main・develop に push したとき（出すものが変わるファイルだけ。文書・仕様・infra/ だけの変更では流れない）と、そのブランチから手で流したとき。
# - develop：ステージングに出す。
# - main（週ごとのリリース・緊急の直し）：先にステージングに同じ中身を出し、GitHub の環境 production の承認者が承認したら本番に出す。
# 時間帯：日本時間の8時15分〜23時に始まったときだけ出す（DB は夜間〈0時〜8時〉止まる。AD-10）。
# 夜に緊急で出すとき：main で手で流し、wake_db を入にする（日本時間の0時〜7時45分だけ）。DB を一時的に起こしてから出し、
# keep_awake_minutes の分だけ起こしておいたあと（直ったかを画面で確かめるため）、必ず止め直す。承認と本番のデプロイは、その時間の中で済ませる。
# 1つの環境へのデプロイの中身は deploy-environment.yml。外の部品はコミットの指紋（SHA）で固定し、版の名前を注釈に書く（Dependabot が新しくする）。
name: deploy

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-environment.yml"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      skip_hour_check:
        description: "時間帯の確かめ（日本時間の8時15分〜23時に始まったときだけ出す）を飛ばす。夜間の停止を止めて DB が動いていると確かめたときだけ"
        type: boolean
        default: false
      wake_db:
        description: "夜（日本時間の0時〜7時45分）に緊急で出す：DB を一時的に起こしてから出し、あとで止め直す"
        type: boolean
        default: false
      keep_awake_minutes:
        description: "wake_db のとき、DB を起こしておく分（10〜60。この中で、ステージングでの確かめ・承認・本番のデプロイを済ませる）"
        type: number
        default: 40

# 同じブランチのデプロイは1つずつ。DB の変更の途中で止めないよう、流れているものは取り消さず、後のものを待たせる
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 時間帯の確かめ。DB は夜間（0時〜8時。日本時間）に止まっているので、その間は db:migrate が落ちる。GitHub Actions は時刻で止められないので、ここで早く落とす。
  # 始まる時刻だけを見るので、余裕を持たせる：8時15分から（8時に起こした DB が動き出すまで数分かかる）・23時まで（0時の停止までに終わる）。
  # wake_db は、DB を止めている0時〜7時45分だけ（8時の起動と重ならないように）。
  prepare:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      wake: ${{ steps.window.outputs.wake }}
    steps:
      - name: 時間帯の確かめ（日本時間の8時15分〜23時に始まったときだけ出す）
        id: window
        env:
          WAKE_DB: ${{ inputs.wake_db && 'true' || 'false' }}
          SKIP_HOUR_CHECK: ${{ inputs.skip_hour_check && 'true' || 'false' }}
        run: |
          now=$(TZ=Asia/Tokyo date +%H:%M)
          minutes=$((10#${now%:*} * 60 + 10#${now#*:}))
          if [ "$WAKE_DB" = "true" ]; then
            if [ "$minutes" -ge $((7 * 60 + 45)) ]; then
              echo "::error::日本時間の ${now} です。wake_db（DB を一時的に起こして出す）は、DB を止めている0時〜7時45分だけ使えます。昼はふつうに流してください。"
              exit 1
            fi
            echo "wake=true" >> "$GITHUB_OUTPUT"
            echo "日本時間の ${now} です。DB を一時的に起こして出します。"
            exit 0
          fi
          echo "wake=false" >> "$GITHUB_OUTPUT"
          if [ "$SKIP_HOUR_CHECK" = "true" ]; then
            echo "時間帯の確かめを飛ばします（日本時間の ${now}）。"
            exit 0
          fi
          if [ "$minutes" -lt $((8 * 60 + 15)) ] || [ "$minutes" -ge $((23 * 60)) ]; then
            echo "::error::日本時間の ${now} です。デプロイは8時15分〜23時に始まったときだけ出します（DB は夜間〈0時〜8時〉止まり、8時に起こしてから動き出すまで数分かかるため）。8時15分を過ぎてから、Actions の deploy を同じブランチ（main か develop）で手で流してください（Run workflow）。夜に緊急で出すときは、main で wake_db を入にして流します。"
            exit 1
          fi
          echo "日本時間の ${now} です。デプロイします。"

  # 夜に緊急で出すとき、DB を起こして動き出すまで待つ（ステージングのデプロイの身分で。本番とステージングは同じ DB のサーバー）
  wake-db:
    needs: prepare
    if: needs.prepare.outputs.wake == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SQL_INSTANCE: ${{ vars.SQL_INSTANCE }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: DB を起こす（動き出すまで待つ）
        run: |
          if [ -z "$SQL_INSTANCE" ]; then echo "::error::リポジトリの変数 SQL_INSTANCE がありません（terraform output github_repository_variables）"; exit 1; fi
          gcloud sql instances patch "$SQL_INSTANCE" --activation-policy=ALWAYS --quiet
          for _ in $(seq 1 60); do
            state=$(gcloud sql instances describe "$SQL_INSTANCE" --format='value(state)')
            if [ "$state" = "RUNNABLE" ]; then echo "DB が動いています。"; exit 0; fi
            sleep 10
          done
          echo "::error::DB が10分たっても動き出しませんでした（${state}）"
          exit 1

  staging:
    needs: [prepare, wake-db]
    if: always() && needs.prepare.result == 'success' && (needs.wake-db.result == 'success' || needs.wake-db.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging

  # main のときだけ。GitHub の環境 production の承認者が、ステージングで確かめてから承認すると始まる
  production:
    needs: staging
    if: always() && github.ref == 'refs/heads/main' && needs.staging.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production

  # wake_db のとき、決めた分だけ起こしておいてから、必ず DB を止め直す（途中で失敗しても・承認されなくても）。
  # 8時を過ぎていたら止めない（Cloud Scheduler が8時に起こしたあとの、昼の DB を止めないため）
  stop-db:
    needs: [prepare, wake-db]
    if: always() && needs.prepare.outputs.wake == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      SQL_INSTANCE: ${{ vars.SQL_INSTANCE }}
      KEEP_AWAKE_MINUTES: ${{ inputs.keep_awake_minutes }}
    steps:
      - name: 決めた分だけ待つ
        run: |
          minutes="${KEEP_AWAKE_MINUTES:-40}"
          case "$minutes" in ''|*[!0-9]*) minutes=40 ;; esac
          if [ "$minutes" -lt 10 ]; then minutes=10; fi
          if [ "$minutes" -gt 60 ]; then minutes=60; fi
          echo "${minutes}分たったら DB を止め直します。その間に、ステージングでの確かめ・承認・本番のデプロイを済ませてください。"
          sleep $((minutes * 60))

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: DB を止め直す（夜のあいだだけ）
        run: |
          now=$(TZ=Asia/Tokyo date +%H:%M)
          if [ "$((10#${now%:*}))" -ge 8 ]; then
            echo "日本時間の ${now} です。8時を過ぎたので、DB は止めません（Cloud Scheduler が8時に起こしています）。"
            exit 0
          fi
          gcloud sql instances patch "$SQL_INSTANCE" --activation-policy=NEVER --quiet
          echo "日本時間の ${now}。DB を止め直しました。"
