# 本番とステージングへのデプロイ（core-002・core-018。docs/rules/development-flow.md 5・構成の決めごと AD-11）。
# 流れる時：main（本番）・develop（ステージング）に push したとき（出すものが変わるファイルだけ。文書・仕様・infra/ だけの変更では流れない）と、
# そのブランチから手で流したとき。どちらの環境かはブランチで決め、GitHub の環境（production・staging）の変数を使う。
# 順番：時間帯の確かめ（日本時間の8時15分〜23時に始まったときだけ）→ コンテナを作って Artifact Registry へ → 同じコンテナで db:migrate（Cloud Run jobs）→ 成功したときだけ新しい版を出す。
# GCP へは Workload Identity Federation で入り、デプロイ用のサービスアカウントになりすます（鍵は置かない。Cloud Run は WIF の直の権限に対応していない）。
# 秘密の値（secrets.*）は使わない。使うのは変数（vars.*）だけ（infra/README.md の 5）：
# - リポジトリの変数：GCP_PROJECT_ID・GCP_REGION・GCP_WIF_PROVIDER（terraform output github_repository_variables）
# - 環境の変数（production・staging）：GCP_DEPLOYER_SA・CLOUD_RUN_SERVICE・MIGRATE_JOB・APP_NAME（terraform output の各環境の github_environment_variables）と LIFF_ID（LINE の側）
# 外の部品はコミットの指紋（SHA）で固定し、版の名前を注釈に書く（Dependabot が新しくする）。
name: deploy

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      skip_hour_check:
        description: "時間帯の確かめ（日本時間の8時15分〜23時に始まったときだけ出す）を飛ばす。夜間の停止を止めて DB が動いていると確かめたときだけ"
        type: boolean
        default: false

# デプロイは環境ごとに1つずつ。DB の変更の途中で止めないよう、流れているものは取り消さず、後のものを待たせる
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # main は本番、develop はステージング（GitHub の環境の変数を使い分ける）
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      LIFF_ID: ${{ vars.LIFF_ID }}
      # 画面の題に埋める名前。Terraform の app_name（Cloud Run の APP_NAME）と同じにする（infra/README.md 5）
      APP_NAME: ${{ vars.APP_NAME || 'kanaeru' }}
      # 環境ごとにイメージの名前を分ける（LIFF ID と APP_NAME を組み立てに埋めるので、中身が環境で違う。古いイメージの掃除も環境ごと）
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/kanaeru/app-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}:${{ github.sha }}
    steps:
      # DB は夜間（0時〜8時。日本時間）に止まっているので、その間は db:migrate が落ちる（AD-10。本番とステージングは同じ DB のサーバー）。GitHub Actions は時刻で止められないので、ここで早く落とす。
      # 始まる時刻だけを見るので、余裕を持たせる：
      # - 8時15分から：8時に起こした DB が動き出すまで数分かかる。
      # - 23時まで：コンテナを作るのに数分かかり、db:migrate はそのあと。この仕事は30分で切れる（timeout-minutes）ので、23時に始まっても0時の停止より前に終わる。
      - name: 時間帯の確かめ（日本時間の8時15分〜23時に始まったときだけ出す）
        if: ${{ !inputs.skip_hour_check }}
        run: |
          now=$(TZ=Asia/Tokyo date +%H:%M)
          minutes=$((10#${now%:*} * 60 + 10#${now#*:}))
          if [ "$minutes" -lt $((8 * 60 + 15)) ] || [ "$minutes" -ge $((23 * 60)) ]; then
            echo "::error::日本時間の ${now} です。デプロイは8時15分〜23時に始まったときだけ出します（DB は夜間〈0時〜8時〉止まり、8時に起こしてから動き出すまで数分かかるため）。8時15分を過ぎてから、Actions の deploy を同じブランチ（main か develop）で手で流してください（Run workflow）。交流会で夜間の停止を止めていて DB が動いているときだけ、skip_hour_check を入にして流せます。"
            exit 1
          fi
          echo "日本時間の ${now} です。${DEPLOY_ENV} にデプロイします。"

      - name: リポジトリの変数の確かめ
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          # 空白だけの値も「ない」とみなす。とくに LIFF_ID が空だと、画面は LINE につながない仮の LIFF の形で組み立てられ、黙って本番に出てしまう
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA SERVICE MIGRATE_JOB LIFF_ID APP_NAME; do
            if [ -z "$(printenv "$name" | tr -d '[:space:]')" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::変数がありません：${missing}（${DEPLOY_ENV}。GCP_PROJECT_ID・GCP_REGION・GCP_WIF_PROVIDER はリポジトリの変数、ほかは Settings → Environments → ${DEPLOY_ENV} の変数に入れる。SERVICE は CLOUD_RUN_SERVICE。値は infra/ の terraform output と LINE の LIFF ID。infra/README.md の 5）"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: コンテナを作って Artifact Registry へ押し込む
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --build-arg VITE_LIFF_ID="$LIFF_ID" --build-arg APP_NAME="$APP_NAME" --tag "$IMAGE" .
          docker push "$IMAGE"

      # 同じコンテナで DB の変更を当てる。失敗したら、ここで止まり、新しい版は出ない（AD-11）
      - name: DB の変更を当てる（Cloud Run jobs の db:migrate）
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image="$IMAGE" --region="$GCP_REGION" --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --region="$GCP_REGION" --wait

      - name: 新しい版を出す（Cloud Run）
        run: |
          gcloud run services update "$SERVICE" --image="$IMAGE" --region="$GCP_REGION" --quiet

      - name: 動いているかの確かめ
        run: |
          url=$(gcloud run services describe "$SERVICE" --region="$GCP_REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${url}/api/v1/health"
          echo
          echo "${DEPLOY_ENV} に出しました：${url}"
